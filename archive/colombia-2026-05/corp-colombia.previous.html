<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0;url=https://bitcoinsovereign.academy/institutional/corporations/colombia/">
    <link rel="canonical" href="https://bitcoinsovereign.academy/institutional/corporations/colombia/">
    <title>Redirigiendo al programa Colombia para empresas...</title>
    <style>
        :root {
            --co-yellow: #FCD116;
            --co-blue: #003893;
            --co-red: #CE1126;
            --dark: #0d0d0d;
            --light: #eaeaea;
            --dim: #a0a0a0;
            --grad-flag: linear-gradient(135deg, var(--co-yellow) 0%, var(--co-blue) 50%, var(--co-red) 100%);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background:
                radial-gradient(ellipse at 30% 20%, rgba(252, 209, 22, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(206, 17, 38, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(0, 56, 147, 0.05) 0%, transparent 60%),
                var(--dark);
            color: var(--light);
        }
        main {
            max-width: 720px;
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(252, 209, 22, 0.18);
            border-radius: 1rem;
            padding: 2rem;
            text-align: center;
        }
        .flag {
            font-size: 2.2rem;
            margin-bottom: 0.75rem;
        }
        h1 {
            font-size: clamp(1.8rem, 4vw, 2.4rem);
            margin-bottom: 0.85rem;
            line-height: 1.15;
        }
        p {
            color: var(--dim);
            line-height: 1.7;
            margin-bottom: 1rem;
        }
        a {
            display: inline-block;
            margin-top: 0.5rem;
            padding: 0.85rem 1.6rem;
            border-radius: 999px;
            text-decoration: none;
            font-weight: 700;
            color: #1a1a1a;
            background: var(--grad-flag);
            box-shadow: 0 6px 20px rgba(252, 209, 22, 0.22);
        }
    </style>
</head>
<body>
    <main>
        <div class="flag">🇨🇴</div>
        <h1>Redirigiendo al programa Colombia para empresas</h1>
        <p>Esta versión local redirige al contenido compartido que se sirve desde Bitcoin Sovereign Academy.</p>
        <p>Si no te redirige automáticamente, usa el botón de abajo.</p>
        <a href="https://bitcoinsovereign.academy/institutional/corporations/colombia/">Ir al programa</a>
    </main>
    <script>
        window.location.replace('https://bitcoinsovereign.academy/institutional/corporations/colombia/');
    </script>
</body>
</html>
